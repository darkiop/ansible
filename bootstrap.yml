---
# Bootstrap playbook - applies standard roles to selected host groups
#
# Usage:
#   ansible-playbook bootstrap.yml -l <host-or-group>
#   ansible-playbook bootstrap.yml -l test-host-debian
#   ansible-playbook bootstrap.yml -l pve_lxc --tags role-essentials

- name: Bootstrap - essentials

  hosts:
    - pve_hosts
    - pve_lxc
    - pve_vm
    - vpn_gw_ext
    - test_hosts

  become: true

  roles:
    # ESSENTIALS (Update/Upgrade System, User, dotfiles, Tools, timezone, sudo)
    - role: my.essentials
      tags: role-essentials

    # SSH-Keys
    - role: my.ssh
      tags: role-ssh

    ## MSMTP (https://github.com/chriswayg/ansible-msmtp-mailer)
    - role: chriswayg.msmtp-mailer
      tags: role-msmtp

    ## NTP (https://github.com/geerlingguy/ansible-role-ntp)
    - role: geerlingguy.ntp
      tags: role-ntp

  tasks:
    - name: Create bin directory
      become: true
      become_user: "{{ my_essentials_user_username }}"
      ansible.builtin.file:
        path: ~/bin
        state: directory
        mode: "0755"
      tags: create-bin-dir
