# Role: my.pihole
pihole_cfg_webserver_api_pwhash: "{{ vault_pihole_cfg_webserver_api_pwhash }}"
pihole_cfg_webserver_api_totp_secret: "{{ vault_pihole_cfg_webserver_api_totp_secret }}"
pihole_cfg_webserver_api_app_pwhash: "{{ vault_pihole_cfg_webserver_api_app_pwhash }}"
pihole_srv_backup_post_enable: true

# Conditional forwarding
pihole_cfg_dns_rev_servers:
  - enabled: true
    ip: '10.4.0.0/24'
    server: '10.4.0.9'
    domain: "{{ vault_local_fqdn }}"

# Upstream DNS Servers
pihole_cfg_dns_upstreams:
  - '1.1.1.1#53'
  - '8.8.8.8#53'

